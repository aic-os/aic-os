[package]
name = "aic-wasm"
version = "0.1.0"
edition = "2021"
description = "AIC-OS WASM bridge -- sign transactions in browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
k256 = { version = "0.13", features = ["ecdsa", "schnorr"] }
hex = "0.4"
primitive-types = { version = "0.12", features = ["rlp"] }
sha3 = "0.10"
rlp = "0.5"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
bip39 = { version = "2", features = ["rand"] }
bip32 = { version = "0.5", features = ["secp256k1"] }
rand = { version = "0.8", features = ["getrandom"] }

# КРИТИЧНО: явная зависимость для wasm32, чтобы фича js попала в транзитивный getrandom 0.2
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[workspace]

