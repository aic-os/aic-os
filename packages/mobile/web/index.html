<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="description" content="AIC Wallet">
  <title>AIC Wallet</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script type="module">
    import init, * as aic from './wasm/aic_wasm.js';
    window._aicWasm = null;
    window._aicWasmPromise = (async () => {
      await init();
      window._aicWasm = aic;
      console.log('[AIC] WASM ready, version:', aic.version());
      window.dispatchEvent(new CustomEvent('aic-wasm-ready'));
      return aic;
    })();
  </script>
</body>
</html>
